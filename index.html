<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>朧の夢祀り ―Oboro no Yume-Matsuri―</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #050308;
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "DotGothic16", monospace;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 60px rgba(110, 70, 180, 0.25);
  }
  /* 名前入力オーバーレイ */
  #nameOverlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(4, 3, 10, 0.82);
    z-index: 10;
  }
  #nameBox {
    background: #0d0a18;
    border: 2px solid #8a7ab8;
    padding: 26px 30px;
    text-align: center;
    box-shadow: 0 0 40px rgba(110, 70, 180, 0.4);
  }
  #namePrompt {
    color: #e8e2f0;
    font-size: 18px;
    margin-bottom: 18px;
    letter-spacing: 1px;
  }
  #nameInput {
    font-family: "DotGothic16", monospace;
    font-size: 20px;
    width: 200px;
    padding: 8px 10px;
    background: #181228;
    color: #f0eef8;
    border: 2px solid #5e4090;
    outline: none;
    text-align: center;
  }
  #nameInput:focus { border-color: #9f86d8; }
  #nameBtn {
    display: block;
    margin: 16px auto 0;
    font-family: "DotGothic16", monospace;
    font-size: 17px;
    padding: 8px 28px;
    background: #2a2050;
    color: #e8e2f0;
    border: 2px solid #8a7ab8;
    cursor: pointer;
  }
  #nameBtn:hover { background: #3a2c6a; }
  #nameNote { color: #6a6488; font-size: 12px; margin-top: 12px; }
  /* スマホ用タッチコントロール */
  #touchUI { display: none; }
  @media (pointer: coarse) { #touchUI { display: block; } }
  .tbtn {
    position: fixed;
    bottom: 16px;
    width: 64px; height: 64px;
    line-height: 64px;
    border-radius: 50%;
    background: rgba(40, 30, 70, 0.55);
    border: 2px solid rgba(159, 134, 216, 0.7);
    color: #e8e2f0;
    font-size: 26px;
    text-align: center;
    z-index: 5;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  .tbtn:active { background: rgba(94, 64, 144, 0.75); }
  #padL { left: 14px; }
  #padR { left: 92px; }
  #btnA { right: 14px; font-size: 22px; }
</style>
</head>
<body>
  <canvas id="screen"></canvas>

  <div id="touchUI">
    <div class="tbtn" id="padL">◀</div>
    <div class="tbtn" id="padR">▶</div>
    <div class="tbtn" id="btnA">✦</div>
  </div>

  <div id="nameOverlay">
    <div id="nameBox">
      <div id="namePrompt"></div>
      <input id="nameInput" type="text" maxlength="8" autocomplete="off" placeholder="なまえ">
      <button id="nameBtn">こたえる</button>
      <div id="nameNote">（8文字まで）</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
